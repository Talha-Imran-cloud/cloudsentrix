[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsentrix"
version = "2.0.0"
description = "Multi-Cloud IAM Attack-Path Analyzer — GCP, AWS, Azure, K8s, Terraform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Talha Imran", email = "talhaimran20008@gmail.com" }
]
keywords = [
    "gcp", "aws", "azure", "iam", "security", "cloud", "kubernetes",
    "terraform", "privilege-escalation", "attack-path", "pentest",
    "soc", "mitre", "wiz", "orca", "devsecops"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Operating System :: OS Independent",
]
dependencies = [
    "networkx>=3.0",
    "rich>=13.0",
    "reportlab>=4.0",
    "watchdog>=3.0",
    "requests>=2.31",
    "google-auth>=2.0",
    "google-api-python-client>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
cloudsentrix = "cloudsentrix._entry:main"

[project.urls]
Homepage = "https://cloudsentrix.netlify.app/"
Repository = "https://github.com/Talha-Imran-cloud/cloudsentrix"
"Bug Tracker" = "https://github.com/Talha-Imran-cloud/cloudsentrix/issues"
Documentation = "https://github.com/Talha-Imran-cloud/cloudsentrix#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
