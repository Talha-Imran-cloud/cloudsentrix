[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsentrix"
version = "1.0.0"
description = "GCP IAM Privilege-Escalation Attack-Path Analyzer — Free open-source alternative to Wiz/Orca"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Talha Imran", email = "talha@example.com" }
]
keywords = [
    "gcp", "iam", "security", "cloud", "privilege-escalation",
    "attack-path", "pentest", "soc", "mitre", "wiz", "orca"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Operating System :: OS Independent",
]
dependencies = [
    # Core analysis
    "networkx>=3.0",
    "rich>=13.0",
    # PDF report generation
    "reportlab>=4.0",
    # File watcher (watch command)
    "watchdog>=3.0",
    # Live GCP scanning
    "requests>=2.31",
    "google-auth>=2.0",
    "google-api-python-client>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
cloudsentrix = "cli:main"

[project.urls]
Homepage = "https://github.com/Talha-Imran-cloud/cloudsentrix"
Repository = "https://github.com/Talha-Imran-cloud/cloudsentrix"
"Bug Tracker" = "https://github.com/Talha-Imran-cloud/cloudsentrix/issues"
Documentation = "https://github.com/Talha-Imran-cloud/cloudsentrix#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
